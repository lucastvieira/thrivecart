services:
  server:
    build: ./server
    ports:
      - "8080:80"
    volumes:
      - ./server:/var/www/html
    environment:
      - APP_ENV=development

  client:
    build: ./client
    ports:
      - "3000:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - server
